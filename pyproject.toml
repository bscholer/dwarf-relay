[project]
name = "dwarf3-control"
version = "0.1.0"
description = "Command-line control for a DWARF 3 smart telescope"
requires-python = ">=3.11"
dependencies = ["websocket-client>=1.8", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
dwarf3 = "dwarf3.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dwarf3"]
