[project]
name = "dwarf-relay"
version = "0.6.0"
description = "Relay and control service for DWARF smart telescopes"
requires-python = ">=3.11"
dependencies = [
    "websocket-client>=1.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    # The DWARF message definitions. The library declares no dependencies of its own; its
    # generated protobuf modules need this runtime. A release tarball, so the image needs no git.
    "dwarf_python_api @ https://github.com/stevejcl/dwarf_python_api/archive/refs/tags/v3.1.8.tar.gz",
    "protobuf>=7.35.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
dwarf-relay = "dwarf_relay.cli:main"
dwarf3 = "dwarf_relay.cli:main"  # The old name, kept for scripts and the Home Assistant app.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dwarf_relay"]
